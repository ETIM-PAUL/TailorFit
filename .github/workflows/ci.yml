name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r services/api/requirements.txt -r services/measurement/requirements.txt -r services/segmentation/requirements.txt -r services/quality-gate/requirements.txt -r services/confidence/requirements.txt -r services/style-preview/requirements.txt
      - run: npm ci
        working-directory: services/segmentation
      - run: python scripts/validate-contract.py
      - run: python -m pytest -q
        working-directory: services/api
      - run: python -m pytest -q
        working-directory: services/measurement
      - run: python -m pytest -q
        working-directory: services/segmentation
      - run: python -m pytest -q
        working-directory: services/quality-gate
      - run: python -m pytest -q
        working-directory: services/confidence
      - run: python -m pytest -q
        working-directory: services/style-preview
      - run: node --test tests/logic.test.js
        working-directory: apps/web/capture
