# Render Blueprint: New > Blueprint, pick this repo. Secrets marked sync: false are asked for when you create it.
services:
  - type: web
    name: tailorfit
    runtime: docker
    plan: free            # free sleeps when idle and loses data on restart; use starter + the disk below to keep orders
    # Frankfurt was tried first as the closest Render region to Lagos, but Meta's Model API returned
    # "model_not_found" for every call from there, with the same key and model names that work from a
    # US-based request. Switched to a US region as the fix. If Meta later deploys these models more
    # widely, Frankfurt would be faster for Nigerian users and worth trying again.
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_EMAIL
        value: demo@tailorfit.app
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ALLOW_SIGNUP
        value: "1"
    # On a paid plan, keep orders and accounts across restarts:
    # disk:
    #   name: tailorfit-data
    #   mountPath: /app/data
    #   sizeGB: 1
